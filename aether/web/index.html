<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether — Generative Particle Ecosystem</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <!-- Canvas -->
    <canvas id="canvas"></canvas>

    <!-- Top bar -->
    <div id="topbar">
      <div class="brand">
        <span class="logo">✦</span>
        <span class="title">AETHER</span>
      </div>
      <div class="topbar-stats" id="liveStats">
        <span id="particleCount">0</span> particles ·
        <span id="fpsCount">0</span> fps
      </div>
    </div>

    <!-- Control panel -->
    <div id="panel" class="panel open">
      <div class="panel-header" id="panelToggle">
        <span>Controls</span>
        <span class="chevron">▾</span>
      </div>
      <div class="panel-body">
        <!-- Simulation controls -->
        <div class="section">
          <div class="section-title">Simulation</div>
          <div class="btn-row">
            <button id="btnPlay" class="btn btn-primary">Pause</button>
            <button id="btnReset" class="btn">Reset</button>
            <button id="btnRandomize" class="btn">Randomize Rules</button>
          </div>
          <div class="slider-group">
            <label>Particles <span id="valParticles">300</span></label>
            <input type="range" id="sliderParticles" min="50" max="800" value="300" step="10">
          </div>
          <div class="slider-group">
            <label>Particle Types <span id="valTypes">4</span></label>
            <input type="range" id="sliderTypes" min="2" max="8" value="4" step="1">
          </div>
          <div class="slider-group">
            <label>Interaction Range <span id="valRange">80</span></label>
            <input type="range" id="sliderRange" min="30" max="150" value="80" step="5">
          </div>
          <div class="slider-group">
            <label>Force Strength <span id="valForce">0.5</span></label>
            <input type="range" id="sliderForce" min="0.1" max="1.5" value="0.5" step="0.05">
          </div>
          <div class="slider-group">
            <label>Friction <span id="valFriction">0.85</span></label>
            <input type="range" id="sliderFriction" min="0.70" max="0.95" value="0.85" step="0.01">
          </div>
        </div>

        <!-- Audio controls -->
        <div class="section">
          <div class="section-title">Audio</div>
          <div class="btn-row">
            <button id="btnAudio" class="btn">Enable Audio</button>
          </div>
          <div class="slider-group">
            <label>Volume <span id="valVolume">40%</span></label>
            <input type="range" id="sliderVolume" min="0" max="100" value="40" step="5">
          </div>
          <div class="slider-group">
            <label>Scale</label>
            <select id="selectScale" class="select">
              <option value="pentatonic">Pentatonic</option>
              <option value="minorPent">Minor Pentatonic</option>
              <option value="dorian">Dorian</option>
              <option value="lydian">Lydian</option>
              <option value="whole">Whole Tone</option>
            </select>
          </div>
          <div class="slider-group">
            <label>Root Note</label>
            <select id="selectRoot" class="select">
              <option value="C">C</option>
              <option value="D">D</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="G">G</option>
              <option value="A">A</option>
              <option value="B">B</option>
            </select>
          </div>
        </div>

        <!-- Presets -->
        <div class="section">
          <div class="section-title">Saved Worlds</div>
          <div class="preset-input-row">
            <input type="text" id="presetName" class="input" placeholder="World name..." maxlength="60">
            <button id="btnSavePreset" class="btn btn-small">Save</button>
          </div>
          <div id="presetList" class="preset-list">
            <div class="preset-empty">No saved worlds yet</div>
          </div>
        </div>

        <!-- Interaction matrix viz -->
        <div class="section">
          <div class="section-title">Interaction Matrix</div>
          <canvas id="matrixCanvas" width="200" height="200" class="matrix-canvas"></canvas>
          <div class="matrix-legend">
            <span class="legend-item"><span class="legend-color attract"></span> Attract</span>
            <span class="legend-item"><span class="legend-color repel"></span> Repel</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="overlay">
      <div class="spinner"></div>
      <div class="overlay-text">Initializing Aether...</div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="/api/folder-apps/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
